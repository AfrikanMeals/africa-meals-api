# Tier 1–2 — tests unitaires, domaines sensibles, smoke e2e (MongoDB).
# Voir .cursor/rules/api-post-update-testing.mdc

name: API tests

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - 'test/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'nest-cli.json'
      - '.github/workflows/api-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'nest-cli.json'
      - '.github/workflows/api-tests.yml'

concurrency:
  group: api-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  CI: 'true'
  DISABLE_SWAGGER: 'true'
  GRPC_API_SERVER_ENABLED: 'false'
  JWT_SECRET: ci-jwt-secret-minimum-16-chars
  JWT_REFRESH_SECRET: ci-refresh-secret-distinct-from-jwt
  JWT_EXPIRATION: 30m
  JWT_REFRESH_EXPIRATION: 30d

jobs:
  lint-and-build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck)
        run: npm run build

  unit-tests:
    name: Unit tests (Tier 1)
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Jest unit + integration specs
        run: npm run test:ci

  domain-tests:
    name: Domain tests (Tier 2)
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Auth, orders, billing, cart, delivery-agent
        run: npm run test:domain

  e2e-smoke:
    name: E2E smoke (Tier 2)
    runs-on: ubuntu-latest
    needs: lint-and-build
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/africa_meals_ci
      MONGOOSE_SERVER_SELECTION_MS: '15000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: E2E smoke (health + root)
        run: npm run test:e2e:ci
