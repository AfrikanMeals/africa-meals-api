# Déploiement Docker standalone (CentOS / VPS).
#
# Prérequis : Docker Engine 24+ ou docker compose v2.
#
# Build + run :
#   cp .env.docker .env.docker.local   # ajuster SERVER_URL / domaine du VPS
#   ./scripts/docker-build.sh
#   docker compose up -d
#
# Pull Hub (VPS CentOS — sans build local) :
#   docker pull borix102/africa-meals-api:docker
#   scp docker-compose.yml .env.docker root@vps:/opt/wise-eat/
#   docker compose --env-file .env.docker up -d

services:
  api:
    image: ${DOCKER_IMAGE:-borix102/africa-meals-api:docker}
    container_name: africa-meals-api
    restart: unless-stopped
    # host : évite 502 nginx→127.0.0.1:9000 sur CentOS/CWP (docker-proxy / 127.0.0.1 publish)
    network_mode: ${DOCKER_NETWORK:-host}
    env_file:
      - ${ENV_FILE:-.env.docker}
    # Sans network_mode: host — décommenter ports et retirer network_mode ci-dessus
    # ports:
    #   - "127.0.0.1:${API_HTTP_PORT:-9000}:9000"
    #   - "127.0.0.1:${GRPC_API_PORT:-50052}:50052"
    # Firebase (optionnel) : décommenter si accounts.json présent sur le VPS
    # volumes:
    #   - ./accounts.json:/app/africa-meals-api/accounts.json:ro
    extra_hosts:
      # Résolution DNS hôte si besoin (Mongo/Redis TLS publics)
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  ws-notify-worker:
    image: ${DOCKER_IMAGE:-borix102/africa-meals-api:docker}
    container_name: africa-meals-api-ws-notify-worker
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.docker}
    command: ["node", "dist/workers/ws-notify-worker.main.js"]
    profiles:
      - worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
